name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slotbook_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: slotbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: part-b/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Run Part A examples
        run: |
          python -X utf8 part-a/Pagination_bar_A1.py
          python -X utf8 part-a/duplicate_leads_A3.py
          python -X utf8 part-a/settle_up_A4.py
      - run: npm ci
        working-directory: part-b
      - run: npm run check
        working-directory: part-b
      - run: npm test
        working-directory: part-b
      - run: npm run test:postgres
        working-directory: part-b
        env:
          TEST_DATABASE_URL: postgresql://slotbook_test:local_ci_only@localhost:5432/slotbook_test
      - name: Verify Vercel frontend build
        run: npm run build:vercel
        working-directory: part-b
        env:
          RENDER_BACKEND_URL: https://example.onrender.com
      - run: npm audit --omit=dev --audit-level=high
        working-directory: part-b
